version: '3.8'

# Local development setup with PostgreSQL for chat persistence
# Usage:
#   docker-compose up -d postgres    # Start only PostgreSQL
#   docker-compose up --build        # Start all services

services:
  # PostgreSQL for local development
  postgres:
    image: postgres:15
    container_name: capacity-chatbot-postgres
    environment:
      POSTGRES_USER: chatbot_dev
      POSTGRES_PASSWORD: chatbot_dev_password
      POSTGRES_DB: capacity_chatbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_dev -d capacity_chatbot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Capacity Chatbot Service
  chatbot:
    build: .
    container_name: capacity-chatbot-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3334:3334"
    env_file:
      - .env
    environment:
      # Override PostgreSQL to use local container
      - POSTGRES_CONNECTION_STRING=postgresql://chatbot_dev:chatbot_dev_password@postgres:5432/capacity_chatbot_db

volumes:
  postgres_data:
