apiVersion: v1
kind: Service
metadata:
  name: capacity-chatbot-service
  namespace: default  # Change to your namespace if needed
  labels:
    app: capacity-chatbot-service
spec:
  type: ClusterIP  # Use LoadBalancer or NodePort if you need external access
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: capacity-chatbot-service
  sessionAffinity: ClientIP  # Useful for maintaining conversation state

