apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-capacity-chatbot
  namespace: default  # Change to your namespace if needed
  labels:
    app: appointment-capacity-chatbot
    version: "0.1.0"
spec:
  replicas: 2  # Adjust based on your needs
  selector:
    matchLabels:
      app: appointment-capacity-chatbot
  template:
    metadata:
      labels:
        app: appointment-capacity-chatbot
        version: "0.1.0"
    spec:
      containers:
      - name: appointment-capacity-chatbot-backend
        image: 578061096415.dkr.ecr.us-east-1.amazonaws.com/appointment-capacity-chatbot:0.1.0  # Update version as needed
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        # LangGraph Configuration
        - name: PORT
          value: "8000"
        
        # Database Configuration (SQLite)
        - name: SQLITE_DB_PATH
          value: "/app/data/checkpoints.sqlite"
        
        # OpenAI Configuration
        - name: OPENAI_API_KEY
          value: "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"  # TODO: Replace with your key
        - name: MODEL
          value: "gpt-4o-mini"
        
        # LangSmith Configuration
        - name: LANGSMITH_API_KEY
          value: "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"  # TODO: Replace with your key
        - name: LANGCHAIN_TRACING_V2
          value: "true"
        - name: LANGCHAIN_PROJECT
          value: "capacity-chatbot"
        
        # KAppointment API Configuration
        - name: KAPPOINTMENT_API_BASE_URL
          value: "http://kappointment-api-service:2828/"  # TODO: Update if needed
        - name: MYKAARMA_MKID
          value: "e0340870-dec8-476a-99ff-8a3ce4980488"  # TODO: Replace with your MKID
        
        # Required UUIDs
        - name: DEFAULT_DEPARTMENT_UUID
          value: "8ec821aefe98664ab15df7c426c3c46f9c37d0b1aeda9ff58df3db89bb0a55a3"  # TODO: Replace with your UUID
        - name: DEFAULT_DEALER_UUID
          value: "cb731d36fd635ddd6ef8dd43500892b0c0249d1c01a46dbcc445a809c0a8e3b2"  # TODO: Replace with your UUID
        
        # Logging
        - name: LOG_LEVEL
          value: "INFO"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        volumeMounts:
        - name: sqlite-data
          mountPath: /app/data
        
        # Health checks - LangGraph dev server may not have /health endpoint
        # Using TCP check instead, or remove if not needed
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Alternative: If LangGraph exposes /docs or /assistants endpoint, use:
        # httpGet:
        #   path: /assistants
        #   port: 8000
      
      volumes:
      - name: sqlite-data
        emptyDir: {}  # Using emptyDir for testing - data will be lost on pod restart
      
      # Image pull secrets for ECR (if needed)
      imagePullSecrets:
      - name: ecr-registry-secret  # Create this secret if ECR requires authentication
      
      restartPolicy: Always

