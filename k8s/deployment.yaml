apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-chatbot-service
  namespace: default  # Change to your namespace if needed
  labels:
    app: capacity-chatbot-service
    version: "0.1.0"
spec:
  replicas: 2  # Adjust based on your needs
  selector:
    matchLabels:
      app: capacity-chatbot-service
  template:
    metadata:
      labels:
        app: capacity-chatbot-service
        version: "0.1.0"
    spec:
      containers:
      - name: capacity-chatbot-backend
        image: 578061096415.dkr.ecr.us-east-1.amazonaws.com/appointment-capacity-chatbot:0.1.0  # Update version as needed
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        # LangGraph Configuration
        - name: PORT
          value: "8000"
        
        # Database Configuration (SQLite)
        - name: SQLITE_DB_PATH
          value: "/app/data/checkpoints.sqlite"
        
        # OpenAI Configuration
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: capacity-chatbot-secrets
              key: openai-api-key
        - name: MODEL
          valueFrom:
            configMapKeyRef:
              name: capacity-chatbot-config
              key: model
        
        # LangSmith Configuration
        - name: LANGSMITH_API_KEY
          valueFrom:
            secretKeyRef:
              name: capacity-chatbot-secrets
              key: langsmith-api-key
        - name: LANGCHAIN_TRACING_V2
          valueFrom:
            configMapKeyRef:
              name: capacity-chatbot-config
              key: langchain-tracing-v2
        - name: LANGCHAIN_PROJECT
          valueFrom:
            configMapKeyRef:
              name: capacity-chatbot-config
              key: langchain-project
        
        # KAppointment API Configuration
        - name: KAPPOINTMENT_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: capacity-chatbot-config
              key: kappointment-api-base-url
        - name: MYKAARMA_MKID
          valueFrom:
            secretKeyRef:
              name: capacity-chatbot-secrets
              key: mykaarma-mkid
        
        # Required UUIDs
        - name: DEFAULT_DEPARTMENT_UUID
          valueFrom:
            secretKeyRef:
              name: capacity-chatbot-secrets
              key: default-department-uuid
        - name: DEFAULT_DEALER_UUID
          valueFrom:
            secretKeyRef:
              name: capacity-chatbot-secrets
              key: default-dealer-uuid
        
        # Logging
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: capacity-chatbot-config
              key: log-level
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        volumeMounts:
        - name: sqlite-data
          mountPath: /app/data
        
        # Health checks - LangGraph dev server may not have /health endpoint
        # Using TCP check instead, or remove if not needed
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Alternative: If LangGraph exposes /docs or /assistants endpoint, use:
        # httpGet:
        #   path: /assistants
        #   port: 8000
      
      volumes:
      - name: sqlite-data
        persistentVolumeClaim:
          claimName: capacity-chatbot-pvc
      
      # Image pull secrets for ECR (if needed)
      imagePullSecrets:
      - name: ecr-registry-secret  # Create this secret if ECR requires authentication
      
      restartPolicy: Always

