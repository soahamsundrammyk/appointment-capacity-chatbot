[project]
name = "capacity-chatbot-service"
version = "0.1.0"
description = "AI-powered capacity chatbot for appointment scheduling"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-anthropic>=0.1.0",
    "langchain>=0.2.14",
    "httpx>=0.27.0",
    "langsmith>=0.4.49",
    "pydantic>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "ruff>=0.6.1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {}}
