[project]
name = "capacity-chatbot-service"
version = "0.1.0"
description = "AI-powered capacity chatbot for appointment scheduling"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-openai>=0.1.22",
    "langchain-anthropic>=0.1.0",
    "langchain>=0.2.14",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "langsmith>=0.4.49",
    "langgraph-checkpoint>=3.0.1",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0.0",  
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "ruff>=0.6.1",
    "pytest>=8.3.5",
    "langgraph-cli[inmem]>=0.4.7",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {where = ["src"]}}
package-dir = {"" = "src"}

[tool.ruff]
lint.select = ["E", "F", "I", "D", "T201", "UP"]
lint.ignore = ["UP006", "UP007", "UP035", "D417", "E501"]
line-length = 100

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

